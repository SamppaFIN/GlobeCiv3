<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>🌍 GlobeCiv3</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Kartografi start screen background (design view 1a); the canvas is transparent over it */
      html, body { width: 100%; height: 100%; overflow: hidden; background: #10111b radial-gradient(120% 70% at 50% 52%, #1c1f30 0%, #161826 55%, #10111b 100%); }
      #globe-container { position: fixed; inset: 0; z-index: 1; }
      #globe-container canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="globe-container"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

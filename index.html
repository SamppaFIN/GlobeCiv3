<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>🌍 GlobeCiv3</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14; }
      #globe-container { position: fixed; inset: 0; z-index: 1; }
      #globe-container canvas { display: block; touch-action: none; }
      #sim-overlay {
        position: fixed; inset: 0; z-index: 1000;
        display: none; background: rgba(0,0,0,0.9);
        pointer-events: none;
      }
      #sim-overlay.active { display: block; pointer-events: auto; }
      #sim-overlay canvas { display: block; }
      #sim-close {
        position: fixed; top: 12px; right: 12px; z-index: 1010;
        padding: 8px 16px; background: rgba(200,60,60,0.8);
        color: white; border: none; border-radius: 6px;
        cursor: pointer; font-size: 14px; display: none;
      }
      #sim-overlay.active ~ #sim-close { display: block; }
    </style>
  </head>
  <body>
    <div id="globe-container"></div>
    <div id="sim-overlay"></div>
    <button id="sim-close" onclick="window.closeSimulation?.()">✕ Sulje</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
